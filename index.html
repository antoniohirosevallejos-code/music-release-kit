<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#020712"
  >

  <title>MP3 to WEBM Video Visualizer</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="brand">
        <div class="brand-title">
          MP3 TO WEBM
        </div>

        <div class="brand-subtitle">
          VIDEO VISUALIZER
        </div>
      </div>

    </header>


    <!-- =========================
         AUDIO
    ========================== -->

    <section class="card">

      <div class="section-label">
        AUDIO
      </div>

      <label
        class="upload-card"
        for="audioInput"
      >

        <div class="upload-icon">
          ↑
        </div>

        <div class="upload-content">

          <strong>
            SUBIR MP3 / WAV
          </strong>

          <span id="fileLabel">
            Máx. recomendado: 200 MB
          </span>

        </div>

        <input
          id="audioInput"
          type="file"
          accept="audio/mpeg,audio/wav,audio/x-wav,audio/*"
          hidden
        >

      </label>

    </section>


    <!-- =========================
         INFORMACIÓN
    ========================== -->

    <section class="card">

      <div class="field">

        <label
          class="section-label"
          for="artist"
        >
          ARTISTA
        </label>

        <input
          id="artist"
          type="text"
          placeholder="Nombre del artista"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label
          class="section-label"
          for="title"
        >
          TÍTULO DE LA CANCIÓN
        </label>

        <input
          id="title"
          type="text"
          placeholder="Título de la canción"
          autocomplete="off"
        >

      </div>

    </section>


    <!-- =========================
         PREVIEW
    ========================== -->

    <section class="preview-section">

      <div class="preview-heading">

        <span class="preview-heading-text">
          PREVISUALIZACIÓN DE 20 SEGUNDOS
        </span>

      </div>


      <div class="preview-card">

        <div class="preview-wrap">

          <canvas
            id="canvas"
            width="1080"
            height="1920"
          ></canvas>

          <!-- Estado inicial vacío -->
          <div
            id="emptyState"
            class="empty-state"
            aria-hidden="true"
          ></div>

        </div>


        <!-- Controles del preview -->

        <div class="preview-controls">

          <button
            id="playPreview"
            type="button"
            aria-label="Reproducir preview"
            disabled
          >
            ▶
          </button>

          <span
            id="previewTime"
            class="preview-time"
          >
            0:00 / 0:20
          </span>

          <div
            class="preview-progress-track"
            aria-hidden="true"
          >
            <div
              id="previewProgress"
              class="preview-progress"
            ></div>
          </div>

          <button
            id="mutePreview"
            type="button"
            aria-label="Activar o silenciar audio"
            disabled
          >
            ◉
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         CONFIGURACIÓN
    ========================== -->

    <section class="card">

      <div class="field">

        <label
          class="section-label"
          for="styleSelect"
        >
          ESTILO
        </label>

        <select id="styleSelect">

          <option value="spectrum">
            Espectro eléctrico
          </option>

          <option value="wave">
            Onda eléctrica
          </option>

          <option value="particles">
            Partículas
          </option>

        </select>

      </div>


      <div class="field">

        <label
          class="section-label"
          for="formatSelect"
        >
          FORMATO
        </label>

        <select id="formatSelect">

          <option value="vertical">
            9:16 · TikTok / Reels / Shorts
          </option>

          <option value="portrait">
            4:5 · Instagram
          </option>

          <option value="square">
            1:1 · Cuadrado
          </option>

          <option value="landscape">
            16:9 · YouTube / Desktop
          </option>

        </select>

      </div>

    </section>


    <!-- =========================
         EXPORTACIÓN
    ========================== -->

    <section class="card export-card">

      <button
        id="exportButton"
        type="button"
        disabled
      >
        EXPORTAR WEBM
      </button>


      <div
        class="export-progress-container"
        aria-live="polite"
      >

        <div
          class="export-progress-track"
        >

          <div
            id="exportFill"
            class="export-progress"
            style="width: 0%"
          ></div>

        </div>

      </div>


      <div
        id="status"
        class="status"
      >
        Sube una canción para comenzar.
      </div>

    </section>


  </main>


  <script src="app.js"></script>

</body>
</html>
